[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poretimenet"
version = "0.2.0"
description = "Spatiotemporal neural network for 4D pore-scale image segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0 AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/Apache-2.0.txt"]
dependencies = [
    "torch==2.6.0",
    "monai==1.5.0",
    "numpy==2.2.6",
    "einops==0.8.1",
    "nibabel==5.3.2",
    "tifffile==2025.5.10",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
poretimenet-demo = "poretimenet.demo:main"
poretimenet-train = "poretimenet.train:main"
poretimenet-predict = "poretimenet.inference:main"

[tool.setuptools.packages.find]
include = ["poretimenet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
